name: Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

env:
  KEEPALIVE_URL: https://amanah-egh5.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        id: health
        run: |
          url="${KEEPALIVE_URL%/}/health"
          status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 120 "$url")

          if [ "$status" != "200" ]; then
            echo "Health check failed: $url returned HTTP $status"
            exit 1
          fi

          echo "Health check OK: $url"
