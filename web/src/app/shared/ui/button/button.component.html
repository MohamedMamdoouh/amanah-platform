<button
  class="btn"
  [class.btn--primary]="variant() === 'primary'"
  [class.btn--secondary]="variant() === 'secondary'"
  [class.btn--outline]="variant() === 'outline'"
  [class.btn--ghost]="variant() === 'ghost'"
  [class.btn--danger]="variant() === 'danger'"
  [class.btn--sm]="size() === 'sm'"
  [class.btn--loading]="loading()"
  [class.btn--disabled]="ariaDisabled() || (routerLink() && disabled())"
  [type]="routerLink() ? 'button' : type()"
  [disabled]="!routerLink() && (disabled() || loading())"
  [attr.aria-disabled]="routerLink() && (ariaDisabled() || disabled() || loading()) ? 'true' : null"
  [routerLink]="routerLink()"
  (click)="onClick($event)"
>
  @if (loading()) {
    <app-spinner size="sm" />
  }
  <span class="btn__label"><ng-content /></span>
</button>
