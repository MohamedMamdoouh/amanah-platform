@if (routerLink(); as link) {
  <a
    class="card"
    [class.card--interactive]="variant() === 'interactive'"
    [class.card--inset]="variant() === 'inset'"
    [class.card--padding-md]="padding() === 'md'"
    [routerLink]="link"
  >
    <ng-content />
  </a>
} @else {
  <div
    class="card"
    [class.card--interactive]="variant() === 'interactive'"
    [class.card--inset]="variant() === 'inset'"
    [class.card--padding-md]="padding() === 'md'"
  >
    <ng-content />
  </div>
}
