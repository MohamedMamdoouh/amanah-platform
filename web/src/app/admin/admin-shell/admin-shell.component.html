<section class="admin-shell page-container--wide" aria-labelledby="admin-title">
  <header class="admin-shell__header">
    <h1 id="admin-title" class="admin-shell__title">
      {{ "admin.title" | translate }}
    </h1>
    <nav
      class="admin-shell__routes"
      [attr.aria-label]="'admin.title' | translate"
    >
      <a
        routerLink="/admin/moderation"
        routerLinkActive="admin-shell__route--active"
        class="admin-shell__route"
      >
        <span class="admin-shell__route-label">{{
          "admin.nav.moderation" | translate
        }}</span>
      </a>
      <a
        routerLink="/admin/abuse"
        routerLinkActive="admin-shell__route--active"
        class="admin-shell__route"
      >
        <span class="admin-shell__route-label">{{
          "admin.nav.abuse" | translate
        }}</span>
      </a>
      <a
        routerLink="/admin/users"
        routerLinkActive="admin-shell__route--active"
        class="admin-shell__route"
      >
        <span class="admin-shell__route-label">{{
          "admin.nav.users" | translate
        }}</span>
      </a>
      <a
        routerLink="/admin/categories"
        routerLinkActive="admin-shell__route--active"
        class="admin-shell__route"
      >
        <span class="admin-shell__route-label">{{
          "admin.nav.categories" | translate
        }}</span>
      </a>
    </nav>
  </header>
  <router-outlet />
</section>
