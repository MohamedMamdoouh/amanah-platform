<section class="notifications page-container" aria-labelledby="notifications-title">
  <app-page-header
    [title]="'notifications.title' | translate"
    [intro]="'notifications.intro' | translate"
  >
    @if (items().length > 0) {
      <app-button
        variant="ghost"
        size="sm"
        [loading]="markingAll()"
        (clicked)="markAllRead()"
      >
        {{ 'notifications.mark_all_read' | translate }}
      </app-button>
    }
  </app-page-header>

  @if (loading()) {
    <app-loading-indicator [label]="'notifications.loading' | translate" />
  } @else if (error()) {
    <app-alert variant="error">{{ error() }}</app-alert>
  } @else if (items().length === 0) {
    <app-empty-state [title]="'notifications.empty' | translate" />
  } @else {
    <ul class="notifications__list">
      @for (item of items(); track item.id) {
        <li>
          <button
            type="button"
            class="notifications__item"
            [class.notifications__item--unread]="!item.isRead"
            (click)="openNotification(item)"
          >
            <span class="notifications__item-type">{{ typeLabel(item.payload.type) }}</span>
            @if (item.payload.reasonCode) {
              <span class="notifications__item-reason">
                {{ reasonLabel(item.payload.reasonCode) }}
              </span>
            }
            @if (item.payload.note) {
              <span class="notifications__item-note">{{ item.payload.note }}</span>
            }
            <span class="notifications__item-date">
              {{ item.payload.createdAt | appDate }}
            </span>
            <span class="notifications__item-link">
              {{ linkLabel(item) }}
            </span>
          </button>
        </li>
      }
    </ul>
  }
</section>
