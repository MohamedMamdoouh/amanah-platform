<div class="photo-upload">
  @if (error()) {
    <app-alert variant="error">{{ error() }}</app-alert>
  }

  <div class="photo-upload__grid">
    @for (photo of photos(); track photo.id) {
      <figure class="photo-upload__item">
        <img
          [src]="photo.previewUrl"
          [alt]="photo.fileName"
          class="photo-upload__thumb"
        />
        <button
          type="button"
          class="photo-upload__remove"
          [disabled]="disabled()"
          (click)="removePhoto(photo.id)"
        >
          {{ 'reports.photos.remove' | translate }}
        </button>
      </figure>
    }

    @if (canAddMore()) {
      <label class="photo-upload__add form-dropzone">
        <input
          type="file"
          accept="image/jpeg,image/png,image/webp"
          multiple
          class="photo-upload__input sr-only"
          [disabled]="disabled()"
          (change)="onFilesSelected($event)"
        />
        <app-icon name="camera" size="lg" />
        <span class="form-dropzone__label">{{ 'reports.photos.add' | translate }}</span>
      </label>
    }
  </div>

  <p class="photo-upload__hint form-hint">
    {{ 'reports.photos.hint' | translate: { max: maxPhotos } }}
  </p>
</div>
