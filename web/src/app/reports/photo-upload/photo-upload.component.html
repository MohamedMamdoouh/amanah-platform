<div class="photo-upload">
  @if (error()) {
    <p class="photo-upload__error" role="alert">{{ error() }}</p>
  }

  <div class="photo-upload__grid">
    @for (photo of photos(); track photo.id) {
      <figure class="photo-upload__item">
        <img
          [src]="photo.previewUrl"
          [alt]="photo.fileName"
          class="photo-upload__thumb"
        />
        <button
          type="button"
          class="photo-upload__remove"
          [disabled]="disabled()"
          (click)="removePhoto(photo.id)"
        >
          {{ "reports.photos.remove" | translate }}
        </button>
      </figure>
    }
  </div>

  @if (canAddMore()) {
    <label class="photo-upload__add">
      <input
        type="file"
        accept="image/jpeg,image/png,image/webp"
        multiple
        class="photo-upload__input"
        [disabled]="disabled()"
        (change)="onFilesSelected($event)"
      />
      <span class="photo-upload__add-label">
        {{ "reports.photos.add" | translate }}
      </span>
    </label>
  }

  <p class="photo-upload__hint">
    {{ "reports.photos.hint" | translate: { max: maxPhotos } }}
  </p>
</div>
