<section class="my-reports page-container" aria-labelledby="my-reports-title">
  <app-page-header
    [title]="'reports.mine.title' | translate"
    [intro]="'reports.mine.intro' | translate"
  />

  <app-tabs
    [tabs]="tabItems()"
    [activeId]="activeTab()"
    [ariaLabel]="'reports.mine.tabs_label' | translate"
    (tabChange)="onTabChange($event)"
  />

  @if (loading()) {
    <app-loading-indicator
      class="my-reports__loading"
      [label]="'reports.mine.loading' | translate"
    />
  } @else if (error()) {
    <app-alert variant="error">{{ error() }}</app-alert>
  } @else if (reports().length === 0) {
    <app-empty-state [title]="emptyMessage()">
      @if (activeTab() === 'pending_review') {
        <app-button variant="primary" [routerLink]="'/report/lost'">
          {{ 'reports.mine.report_lost' | translate }}
        </app-button>
        <app-button variant="outline" [routerLink]="'/report/found'">
          {{ 'reports.mine.report_found' | translate }}
        </app-button>
      }
    </app-empty-state>
  } @else {
    <ul class="my-reports__list">
      @for (report of reports(); track report.id) {
        <li>
          <app-listing-card
            [title]="report.title"
            [reportType]="report.type"
            [subtitle]="categoryLabel(report.categoryCode) + ' · ' + governorateLabel(report.governorateCode)"
            [date]="(report.createdAt | appDate: 'medium') ?? ''"
            [badgeLabel]="domainLabels.reportBadgeLabel(report.status, 'mine')"
            [badgeVariant]="domainLabels.reportBadgeVariant(report.status, 'mine')"
            [routerLink]="['/my/reports', report.id]"
            [actionLabel]="'reports.confirmation.view_detail' | translate"
          />
        </li>
      }
    </ul>
  }
</section>
